<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>see see seabirdrrrr</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#title {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);

    color: white;
    font-size: clamp(20px, 5vw, 36px);
    font-weight: bold;

    text-shadow:
        0 2px 5px rgba(0, 0, 0, 0.5);

    pointer-events: none;
    z-index: 10;
}

#help {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    padding: 10px 16px;

    background: rgba(0, 0, 0, 0.35);
    color: white;

    border-radius: 12px;

    font-size: 14px;
    text-align: center;

    pointer-events: none;
    z-index: 10;
}

#loading {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #87ceeb;
    color: white;

    font-size: 24px;
    font-weight: bold;

    z-index: 100;
}

#loading.hidden {
    display: none;
}
</style>
</head>

<body>

<div id="loading">
    see see seabirdrrrr
</div>

<div id="title">
    see see seabirdrrrr
</div>

<div id="help">
    WASD / 방향키 이동 · 마우스 드래그로 둘러보기 · 모바일 터치
</div>

<canvas id="game"></canvas>

<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";


const canvas =
    document.getElementById("game");

const loading =
    document.getElementById("loading");


/* =========================
   기본 설정
========================= */

const renderer =
    new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;


/* =========================
   Scene
========================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        40,
        180
    );


/* =========================
   Camera
========================= */

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        300
    );

camera.position.set(
    0,
    3,
    12
);


/* =========================
   조명
========================= */

const hemisphereLight =
    new THREE.HemisphereLight(
        0xcfefff,
        0x52733c,
        2
    );

scene.add(hemisphereLight);


const sun =
    new THREE.DirectionalLight(
        0xfff3d0,
        3
    );

sun.position.set(
    -40,
    60,
    20
);

sun.castShadow = true;

scene.add(sun);


/* =========================
   초원
========================= */

const grassMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x63a843,
        roughness: 1
    });


const grassGeometry =
    new THREE.PlaneGeometry(
        180,
        180
    );


const grass =
    new THREE.Mesh(
        grassGeometry,
        grassMaterial
    );

grass.rotation.x =
    -Math.PI / 2;

grass.receiveShadow = true;

scene.add(grass);


/* =========================
   언덕
========================= */

const hillMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x76ad52,
        roughness: 1
    });


for (let i = 0; i < 12; i++) {

    const hill =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                25,
                24,
                16
            ),
            hillMaterial
        );

    hill.scale.set(
        1.5,
        0.25,
        1
    );

    hill.position.set(
        (i - 6) * 22,
        2,
        -45 - Math.random() * 35
    );

    scene.add(hill);
}


/* =========================
   풀
========================= */

const bladeGeometry =
    new THREE.ConeGeometry(
        0.035,
        0.55,
        4
    );

const bladeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3e7d32
    });


const grassCount = 1200;

const grassInstances =
    new THREE.InstancedMesh(
        bladeGeometry,
        bladeMaterial,
        grassCount
    );


const dummy =
    new THREE.Object3D();


for (let i = 0; i < grassCount; i++) {

    const x =
        (Math.random() - 0.5) * 140;

    const z =
        (Math.random() - 0.5) * 140;

    dummy.position.set(
        x,
        0.28,
        z
    );

    dummy.rotation.y =
        Math.random() * Math.PI;

    const scale =
        0.5 + Math.random() * 0.8;

    dummy.scale.set(
        scale,
        scale,
        scale
    );

    dummy.updateMatrix();

    grassInstances.setMatrixAt(
        i,
        dummy.matrix
    );
}

grassInstances.instanceMatrix.needsUpdate = true;

scene.add(grassInstances);


/* =========================
   꽃
========================= */

const flowerColors = [
    0xffffff,
    0xffd6e0,
    0xffef9c
];


for (let i = 0; i < 150; i++) {

    const flower =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.08,
                8,
                6
            ),
            new THREE.MeshBasicMaterial({
                color:
                    flowerColors[
                        i % flowerColors.length
                    ]
            })
        );

    flower.position.set(
        (Math.random() - 0.5) * 120,
        0.08,
        (Math.random() - 0.5) * 120
    );

    scene.add(flower);
}


/* =========================
   구름
========================= */

const cloudMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 1
    });


function createCloud(
    x,
    y,
    z,
    scale
) {

    const cloud =
        new THREE.Group();

    for (let i = 0; i < 6; i++) {

        const part =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    2.5,
                    16,
                    10
                ),
                cloudMaterial
            );

        part.position.set(
            (i - 2.5) * 2.2,
            Math.sin(i) * 0.5,
            0
        );

        part.scale.set(
            1.3,
            0.7,
            1
        );

        cloud.add(part);
    }

    cloud.position.set(
        x,
        y,
        z
    );

    cloud.scale.setScalar(scale);

    scene.add(cloud);
}


createCloud(
    -25,
    25,
    -50,
    1.5
);

createCloud(
    20,
    20,
    -65,
    1.1
);

createCloud(
    0,
    30,
    -100,
    1.8
);


/* =========================
   바다
========================= */

const seaMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3fa7d6,
        roughness: 0.5,
        metalness: 0.05
    });


const sea =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            180,
            50
        ),
        seaMaterial
    );

sea.rotation.x =
    -Math.PI / 2;

sea.position.set(
    0,
    -0.03,
    -90
);

scene.add(sea);


/* =========================
   새
========================= */

const birds = [];


function createBird(
    x,
    y,
    z,
    scale
) {

    const bird =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.35,
                12,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffffff
            })
        );

    body.scale.set(
        1.4,
        0.8,
        0.8
    );


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.22,
                12,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffffff
            })
        );

    head.position.set(
        0.4,
        0.08,
        0
    );


    const wingGeometry =
        new THREE.BoxGeometry(
            0.55,
            0.08,
            0.3
        );


    const wingMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xf2f2f2
        });


    const leftWing =
        new THREE.Mesh(
            wingGeometry,
            wingMaterial
        );

    leftWing.position.set(
        0,
        0,
        0.38
    );

    leftWing.rotation.z =
        -0.2;


    const rightWing =
        new THREE.Mesh(
            wingGeometry,
            wingMaterial
        );

    rightWing.position.set(
        0,
        0,
        -0.38
    );

    rightWing.rotation.z =
        -0.2;


    bird.add(
        body,
        head,
        leftWing,
        rightWing
    );


    bird.position.set(
        x,
        y,
        z
    );

    bird.scale.setScalar(scale);

    scene.add(bird);


    birds.push({
        object: bird,
        leftWing: leftWing,
        rightWing: rightWing,
        speed: 1 + Math.random(),
        offset: Math.random() * 10
    });
}


createBird(
    -8,
    12,
    -25,
    1
);

createBird(
    12,
    15,
    -40,
    0.8
);

createBird(
    25,
    10,
    -55,
    0.7
);


/* =========================
   플레이어 이동
========================= */

const keys = {};

let yaw = 0;
let pitch = -0.08;

let dragging = false;

let lastX = 0;
let lastY = 0;


window.addEventListener(
    "keydown",
    (event) => {

        keys[event.code] = true;

    }
);


window.addEventListener(
    "keyup",
    (event) => {

        keys[event.code] = false;

    }
);


/* =========================
   마우스 / 터치 시점
========================= */

canvas.addEventListener(
    "pointerdown",
    (event) => {

        dragging = true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        canvas.setPointerCapture(
            event.pointerId
        );

    }
);


canvas.addEventListener(
    "pointermove",
    (event) => {

        if (!dragging) {
            return;
        }

        const dx =
            event.clientX - lastX;

        const dy =
            event.clientY - lastY;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        yaw -= dx * 0.004;

        pitch -= dy * 0.003;

        pitch =
            Math.max(
                -1.2,
                Math.min(
                    0.7,
                    pitch
                )
            );

    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        dragging = false;

    }
);


/* =========================
   애니메이션
========================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    const speed =
        7 * delta;


    const forward =
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            Math.cos(yaw)
        );


    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );


    if (
        keys.KeyW ||
        keys.ArrowUp
    ) {

        camera.position.addScaledVector(
            forward,
            -speed
        );

    }


    if (
        keys.KeyS ||
        keys.ArrowDown
    ) {

        camera.position.addScaledVector(
            forward,
            speed
        );

    }


    if (
        keys.KeyA ||
        keys.ArrowLeft
    ) {

        camera.position.addScaledVector(
            right,
            -speed
        );

    }


    if (
        keys.KeyD ||
        keys.ArrowRight
    ) {

        camera.position.addScaledVector(
            right,
            speed
        );

    }


    camera.position.y = 3;


    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;


    /* 새 날갯짓 */

    const time =
        performance.now() * 0.006;


    birds.forEach(
        (bird) => {

            const flap =
                Math.sin(
                    time *
                    bird.speed +
                    bird.offset
                ) * 0.45;

            bird.leftWing.rotation.x =
                flap;

            bird.rightWing.rotation.x =
                -flap;

            bird.object.position.y +=
                Math.sin(
                    time * 0.4 +
                    bird.offset
                ) * 0.002;

            bird.object.position.x +=
                Math.sin(
                    time * 0.12 +
                    bird.offset
                ) * 0.003;

        }
    );


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================
   화면 크기 대응
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


loading.classList.add(
    "hidden"
);

</script>

</body>
</html>
