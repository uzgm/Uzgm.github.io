<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리얼 2D 생체 물리 시뮬레이터 v3.0 - 멀티 본 관절 에디션</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #f1f1f1;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .simulator-wrapper {
            background: #181820;
            border: 3px solid #ff5722;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 87, 34, 0.4);
        }

        canvas {
            background: #050508;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            display: block;
            margin: 0 auto 20px auto;
        }

        .container {
            width: 520px;
            background: #20202a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .gauge-box { margin-bottom: 14px; text-align: left; font-size: 14px; font-weight: bold; }
        .bar-container {
            width: 100%; background: #111; height: 22px;
            border-radius: 11px; overflow: hidden; margin-top: 5px;
            border: 1px solid #444;
        }
        
        .bar-fill { height: 100%; transition: width 0.08s ease-out, background 0.3s; }
        #stamina-bar { width: 100%; background: #4CAF50; }
        #debris-bar { width: 0%; background: #ffeb3b; }
        #fluid-bar { width: 0%; background: #00bcd4; }

        .button-group { display: flex; gap: 12px; margin-top: 20px; }
        button {
            background: #ff5722; color: white; border: none;
            padding: 14px 20px; font-size: 16px; border-radius: 8px;
            cursor: pointer; font-weight: bold; flex: 1;
            box-shadow: 0 4px 10px rgba(255,87,34,0.3);
            transition: all 0.1s;
        }
        button:hover { background: #f4511e; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; transform: none; }

        #log {
            margin-top: 15px; height: 90px; background: #08080c;
            border: 1px solid #333; padding: 12px; overflow-y: auto;
            font-size: 13px; text-align: left; color: #00ffcc;
            border-radius: 8px; font-family: monospace;
        }
    </style>
</head>
<body>

<div class="simulator-wrapper">
    <h2 style="margin-top:0; color:#ff7043; text-shadow: 0 0 10px rgba(255,112,67,0.5);">🔥 리얼 생체 물리 시뮬레이터 v3.0 (멀티 본 관절 에디션)</h2>
    
    <canvas id="simCanvas" width="520" height="240"></canvas>

    <div class="container">
        <div class="gauge-box">
            <label>ATP (지구력/체력 코어): <span id="stamina-text" style="color:#4CAF50;">100%</span></label>
            <div class="bar-container"><div id="stamina-bar" class="bar-fill"></div></div>
        </div>

        <div class="gauge-box">
            <label>마찰 각질/분비물 축적도: <span id="debris-text" style="color:#ffeb3b;">0%</span></label>
            <div class="bar-container"><div id="debris-bar" class="bar-fill"></div></div>
        </div>

        <div class="gauge-box">
            <label>유체 역학 게이지 (정액/윤활): <span id="fluid-text" style="color:#00bcd4;">0%</span></label>
            <div class="bar-container"><div id="fluid-bar" class="bar-fill"></div></div>
        </div>

        <div class="button-group">
            <button id="btn-drive" onclick="actionDrive()">운동성 구동 [스페이스바]</button>
            <button id="btn-rest" onclick="actionRest()">강제 불응기 (휴식)</button>
        </div>

        <div id="log">[시스템] v3.0 멀티 본(Multi-Bone) 관절 구조 장착 완료. 진짜 사람 같은 관절 연동 구동 개시!</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let stamina = 100;
    let debris = 0;
    let fluid = 0;
    let isDriving = false;
    let isRefractory = false;
    let restInterval = null;
    let particles = [];

    const staminaBar = document.getElementById('stamina-bar');
    const debrisBar = document.getElementById('debris-bar');
    const fluidBar = document.getElementById('fluid-bar');
    const staminaText = document.getElementById('stamina-text');
    const debrisText = document.getElementById('debris-text');
    const fluidText = document.getElementById('fluid-text');
    const logBox = document.getElementById('log');
    const btnDrive = document.getElementById('btn-drive');
    const btnRest = document.getElementById('btn-rest');

    function addLog(msg) {
        logBox.innerHTML += `<br>` + msg;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateUI() {
        staminaBar.style.width = stamina + '%';
        staminaText.innerText = stamina + '%';
        staminaText.style.color = stamina < 30 ? '#f44336' : '#4CAF50';
        staminaBar.style.background = stamina < 30 ? '#f44336' : '#4CAF50';

        debrisBar.style.width = debris + '%';
        debrisText.innerText = debris + '%';

        fluidBar.style.width = fluid + '%';
        fluidText.innerText = fluid + '%';

        btnDrive.disabled = isDriving || isRefractory || stamina <= 0;
        btnRest.disabled = isDriving || isRefractory;
    }

    // 뼈대 및 관절 기반 리얼 캐릭터 렌더링 함수 (v3.0 멀티 본 시스템)
    function drawScene(thrustProgress = 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 배경 매트 그리드
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        for(let i=0; i<canvas.width; i+=40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        ctx.strokeStyle = '#ff5722';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(30, 215);
        ctx.lineTo(490, 215);
        ctx.stroke();

        // --- [여성 캐릭터 스켈레톤 관절 구동] ---
        // 여성은 바닥에 고정된 상태에서 골반과 다리 관절(고관절-무릎-발목)이 역동적으로 반응
        let fHipX = 220;
        let fHipY = 165;
        
        // 여성 허벅지/무릎/발목 본 좌표계 (스트로크에 따라 관절이 접히고 펴짐)
        let fKneeX = 290 + (thrustProgress * 6);
        let fKneeY = 195 - (thrustProgress * 4);
        let fAnkleX = 380;
        let fAnkleY = 212;

        // 여성 다리 라인 (다중 관절 폴리곤 렌더링)
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.moveTo(fHipX - 15, fHipY + 10);
        ctx.lineTo(fKneeX - 18, fKneeY);
        ctx.lineTo(fAnkleX, fAnkleY);
        ctx.lineTo(fAnkleX, fAnkleY + 10); // 발목 두께
        ctx.lineTo(fKneeX + 18, fKneeY + 15);
        ctx.lineTo(fHipX + 15, fHipY + 25);
        ctx.closePath();
        ctx.fill();

        // 여성 골반 볼륨 관절
        ctx.fillStyle = '#e91e63';
        ctx.beginPath();
        ctx.arc(fHipX, fHipY, 30, 0, Math.PI * 2);
        ctx.fill();

        // 여성 상체 (척추 관절 연동)
        ctx.fillStyle = '#ff4081';
        ctx.fillRect(fHipX - 110, fHipY - 25, 110, 42);

        // 여성 머리 및 롱헤어
        ctx.fillStyle = '#6d4c41'; // 롱헤어
        ctx.beginPath();
        ctx.moveTo(fHipX - 95, fHipY - 22);
        ctx.quadraticCurveTo(fHipX - 120, fHipY, fHipX - 105, fHipY + 25);
        ctx.lineTo(fHipX - 75, fHipY + 10);
        ctx.lineTo(fHipX - 80, fHipY - 22);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(fHipX - 85, fHipY - 12, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffcc99'; // 얼굴
        ctx.beginPath(); 
        ctx.arc(fHipX - 72, fHipY - 10, 14, 0, Math.PI * 2); 
        ctx.fill();


        // --- [남성 캐릭터 멀티 본 관절 구동] ---
        ctx.save();
        
        let mBaseX = 210;
        let currentMaleX = mBaseX - (thrustProgress * 16); // 피스톤 왕복 스트로크
        let mHipX = currentMaleX;
        let mHipY = 163;

        // 남성 다리 관절 (고관절 -> 무릎 관절 -> 발목 관절)
        let mKneeX = mHipX + 35 + (thrustProgress * 8);
        let mKneeY = 192;
        let mAnkleX = mHipX + 65;
        let mAnkleY = 215;

        // 남성 하체 본(Bone) 폴리곤 (두툼한 슈퍼 굵기 다리)
        ctx.fillStyle = '#303f9f';
        ctx.beginPath();
        ctx.moveTo(mHipX - 12, mHipY + 10);
        ctx.lineTo(mKneeX - 14, mKneeY);
        ctx.lineTo(mAnkleX, mAnkleY);
        ctx.lineTo(mAnkleX + 15, mAnkleY);
        ctx.lineTo(mKneeX + 14, mKneeY + 12);
        ctx.lineTo(mHipX + 18, mHipY + 20);
        ctx.closePath();
        ctx.fill();

        // 남성 골반 관절
        ctx.fillStyle = '#303f9f';
        ctx.beginPath();
        ctx.arc(mHipX, mHipY, 28, 0, Math.PI * 2);
        ctx.fill();

        // 남성 상체 (척추 및 어깨 관절 회전)
        ctx.translate(mHipX, mHipY);
        let spineTilt = -0.45 + (thrustProgress * 0.03);
        ctx.rotate(spineTilt);

        // 상체 근육통합 본
        ctx.fillStyle = '#3f51b5';
        ctx.fillRect(-12, -75, 45, 75);

        // 남성 팔 관절 (어깨 -> 팔꿈치 -> 손목)
        ctx.strokeStyle = '#3f51b5';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(5, -35);
        ctx.lineTo(-30, -5);
        ctx.lineTo(-45, -25); // 손목 관절 꺾임
        ctx.stroke();

        // 머리 및 헤어
        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.arc(20, -95, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.arc(10, -88, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // 4. 관절 마찰 및 유체 분출 파티클
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);

            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function actionDrive() {
        if (isDriving || isRefractory || stamina <= 0) return;

        isDriving = true;
        updateUI();

        stamina -= 14;
        if (stamina < 0) stamina = 0;

        debris += 6;
        if (debris > 100) debris = 100;

        fluid += 12;
        if (fluid > 100) fluid = 100;

        for (let i = 0; i < 18; i++) {
            particles.push({
                x: 218 + (Math.random() - 0.5) * 10,
                y: 165 + (Math.random() - 0.5) * 10,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6 - 2,
                size: Math.random() * 3 + 2,
                color: Math.random() > 0.5 ? 'rgba(255, 235, 59, 0.85)' : 'rgba(0, 188, 212, 0.9)',
                life: 40
            });
        }

        if (stamina === 0) {
            addLog("⚠️ [경고] 멀티 본 코어 관절 과부하! 근육 경련 발생으로 강제 휴식 진입!");
            isDriving = false;
            actionRest();
            return;
        }

        if (stamina < 30) {
            addLog("🔥 [과부하] 관절 인대 한계 돌파! 멀티 스켈레톤 피스톤 가동 중...");
        } else {
            addLog("⚙️ [멀티 본 시스템] 어깨, 골반, 무릎, 발목 관절이 유기적으로 연동되어 피스톤 구동 중!");
        }

        triggerFullBodyAnimation();
    }

    function triggerFullBodyAnimation() {
        let step = 0;
        let maxSteps = 8;
        let interval = setInterval(() => {
            step++;
            // 삼각함수로 관절이 자연스럽게 접히고 펴지는 물리 변위 계산
            let progress = Math.sin((step / maxSteps) * Math.PI);
            drawScene(progress);

            if (step >= maxSteps) {
                clearInterval(interval);
                isDriving = false;
                drawScene(0);
                updateUI();
            }
        }, 35);
    }

    function actionRest() {
        if (isRefractory || isDriving) return;

        isRefractory = true;
        isDriving = false;
        updateUI();
        addLog("💤 [불응기] 관절 쿨다운 진입... 멀티 스켈레톤 인대 회복 및 밀착 휴식 중.");

        restInterval = setInterval(() => {
            stamina += 30;
            if (stamina > 100) stamina = 100;
            updateUI();

            if (stamina >= 100) {
                clearInterval(restInterval);
                restInterval = null;
                isRefractory = false;
                addLog("✅ [시스템 리프레시] 관절 인대 완벽 복구! 다시 구동 가능합니다.");
                updateUI();
            }
        }, 1000);
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            actionDrive();
        }
    });

    drawScene(0);
    updateUI();
</script>

</body>
</html>
