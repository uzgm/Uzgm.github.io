<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리얼 2D 생체 물리 시뮬레이터 v2.3 - 탄탄한 바디 에디션</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #f1f1f1;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .simulator-wrapper {
            background: #181820;
            border: 3px solid #ff5722;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 87, 34, 0.4);
        }

        canvas {
            background: #050508;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            display: block;
            margin: 0 auto 20px auto;
        }

        .container {
            width: 520px;
            background: #20202a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .gauge-box { margin-bottom: 14px; text-align: left; font-size: 14px; font-weight: bold; }
        .bar-container {
            width: 100%; background: #111; height: 22px;
            border-radius: 11px; overflow: hidden; margin-top: 5px;
            border: 1px solid #444;
        }
        
        .bar-fill { height: 100%; transition: width 0.08s ease-out, background 0.3s; }
        #stamina-bar { width: 100%; background: #4CAF50; }
        #debris-bar { width: 0%; background: #ffeb3b; }
        #fluid-bar { width: 0%; background: #00bcd4; }

        .button-group { display: flex; gap: 12px; margin-top: 20px; }
        button {
            background: #ff5722; color: white; border: none;
            padding: 14px 20px; font-size: 16px; border-radius: 8px;
            cursor: pointer; font-weight: bold; flex: 1;
            box-shadow: 0 4px 10px rgba(255,87,34,0.3);
            transition: all 0.1s;
        }
        button:hover { background: #f4511e; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; transform: none; }

        #log {
            margin-top: 15px; height: 90px; background: #08080c;
            border: 1px solid #333; padding: 12px; overflow-y: auto;
            font-size: 13px; text-align: left; color: #00ffcc;
            border-radius: 8px; font-family: monospace;
        }
    </style>
</head>
<body>

<div class="simulator-wrapper">
    <h2 style="margin-top:0; color:#ff7043; text-shadow: 0 0 10px rgba(255,112,67,0.5);">🔥 리얼 생체 물리 시뮬레이터 v2.3 (탄탄한 바디)</h2>
    
    <canvas id="simCanvas" width="520" height="240"></canvas>

    <div class="container">
        <div class="gauge-box">
            <label>ATP (지구력/체력 코어): <span id="stamina-text" style="color:#4CAF50;">100%</span></label>
            <div class="bar-container"><div id="stamina-bar" class="bar-fill"></div></div>
        </div>

        <div class="gauge-box">
            <label>마찰 각질/분비물 축적도: <span id="debris-text" style="color:#ffeb3b;">0%</span></label>
            <div class="bar-container"><div id="debris-bar" class="bar-fill"></div></div>
        </div>

        <div class="gauge-box">
            <label>유체 역학 게이지 (정액/윤활): <span id="fluid-text" style="color:#00bcd4;">0%</span></label>
            <div class="bar-container"><div id="fluid-bar" class="bar-fill"></div></div>
        </div>

        <div class="button-group">
            <button id="btn-drive" onclick="actionDrive()">운동성 구동 [스페이스바]</button>
            <button id="btn-rest" onclick="actionRest()" disabled>강제 불응기 (휴식)</button>
        </div>

        <div id="log">[시스템] v2.3 탄탄한 바디 에디션 로드. 남녀 하체 및 여성 코어 라인이 강화되었습니다!</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let stamina = 100;
    let debris = 0;
    let fluid = 0;
    let isDriving = false;
    let isRefractory = false;
    let particles = [];

    const staminaBar = document.getElementById('stamina-bar');
    const debrisBar = document.getElementById('debris-bar');
    const fluidBar = document.getElementById('fluid-bar');
    const staminaText = document.getElementById('stamina-text');
    const debrisText = document.getElementById('debris-text');
    const fluidText = document.getElementById('fluid-text');
    const logBox = document.getElementById('log');
    const btnDrive = document.getElementById('btn-drive');
    const btnRest = document.getElementById('btn-rest');

    function addLog(msg) {
        logBox.innerHTML += `<br>` + msg;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateUI() {
        staminaBar.style.width = stamina + '%';
        staminaText.innerText = stamina + '%';
        staminaText.style.color = stamina < 30 ? '#f44336' : '#4CAF50';
        staminaBar.style.background = stamina < 30 ? '#f44336' : '#4CAF50';

        debrisBar.style.width = debris + '%';
        debrisText.innerText = debris + '%';

        fluidBar.style.width = fluid + '%';
        fluidText.innerText = fluid + '%';

        btnDrive.disabled = isRefractory || stamina <= 0;
        btnRest.disabled = isDriving || stamina >= 100;
    }

    // 탄탄하게 보강된 캐릭터 렌더링 함수
    function drawScene(thrustOffset = 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 배경 매트 라인
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        for(let i=0; i<canvas.width; i+=40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        ctx.strokeStyle = '#ff5722';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(30, 215);
        ctx.lineTo(490, 215);
        ctx.stroke();

        // 2. [여성 캐릭터] 탄탄한 코어 및 볼륨감 있는 하체 렌더링
        ctx.fillStyle = '#ffcc99'; // 피부톤
        
        // 여성 헤어
        ctx.fillStyle = '#6d4c41';
        ctx.beginPath();
        ctx.arc(80, 152, 22, 0, Math.PI * 2);
        ctx.fill();

        // 여성 머리
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath(); ctx.arc(92, 152, 18, 0, Math.PI * 2); ctx.fill();

        // [탄탄한 코어] 상체 (기존보다 두께감을 주어 볼륨감 있게 수정)
        ctx.fillStyle = '#ff4081';
        ctx.fillRect(108, 138, 115, 50);

        // [강화된 골반] 하체 접합부
        ctx.fillStyle = '#e91e63';
        ctx.beginPath();
        ctx.arc(220, 168, 26, 0, Math.PI * 2);
        ctx.fill();

        // [매우 튼실한 허벅지 및 하체 라인] 볼륨감 있는 곡선 수정
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.moveTo(218, 180);
        ctx.quadraticCurveTo(245, 212, 300, 212); // 허벅지 바깥쪽 라인 (두껍게)
        ctx.lineTo(290, 220);
        ctx.quadraticCurveTo(235, 215, 212, 192); // 허벅지 안쪽 라인
        ctx.fill();

        // 3. [남성 캐릭터] 굵어진 하체 관절 및 밀착 결합 연동
        ctx.save();
        
        let baseAnchorX = 213; 
        let currentMaleX = baseAnchorX - thrustOffset; 

        // [강화된 남성 다리/무릎] 바닥 지지선 (굵기 보강)
        ctx.strokeStyle = '#303f9f';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(currentMaleX + 5, 174);
        ctx.lineTo(currentMaleX + 48, 220); // 굵게 지지하는 남성 다리
        ctx.stroke();

        // 남성 골반/접합부
        ctx.fillStyle = '#303f9f';
        ctx.beginPath();
        ctx.arc(currentMaleX, 169, 18, 0, Math.PI * 2);
        ctx.fill();

        // 남성 상체 (접합부로부터 꺾여 올라가는 구조)
        ctx.translate(currentMaleX, 169);
        let tiltAngle = -0.5 + (thrustOffset * 0.014);
        ctx.rotate(tiltAngle);

        // [근육질 상체] (두께감 보강)
        ctx.fillStyle = '#3f51b5';
        ctx.fillRect(-14, -80, 50, 80); // 상체 몸통

        // 남성 헤어
        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.arc(24, -105, 16, 0, Math.PI * 2);
        ctx.fill();

        // 남성 머리
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.arc(12, -97, 17, 0, Math.PI * 2);
        ctx.fill();

        // 남성 팔 (밀착 라인)
        ctx.strokeStyle = '#3f51b5';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(10, -45);
        ctx.lineTo(-45, -12);
        ctx.stroke();

        ctx.restore();

        // 4. 밀착 접합부 파티클 (각질 및 유체 입자 분출)
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);

            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function actionDrive() {
        if (isRefractory || stamina <= 0) return;

        isDriving = true;

        stamina -= 14;
        if (stamina < 0) stamina = 0;

        debris += 6;
        if (debris > 100) debris = 100;

        fluid += 12;
        if (fluid > 100) fluid = 100;

        for (let i = 0; i < 15; i++) {
            particles.push({
                x: 218 + (Math.random() - 0.5) * 10,
                y: 169 + (Math.random() - 0.5) * 10,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 1.5,
                size: Math.random() * 3 + 2,
                color: Math.random() > 0.5 ? 'rgba(255, 235, 59, 0.85)' : 'rgba(0, 188, 212, 0.9)',
                life: 35
            });
        }

        if (stamina === 0) {
            addLog("⚠️ [경고] 체력 오링! 극심한 근육 경련 발생. 강제 휴식 진입!");
            actionRest();
            return;
        }

        if (stamina < 30) {
            addLog("🔥 [과부하] 코어 근육 한계 돌파! 거친 숨소리 및 음성 피드백 출력 중...");
        } else {
            addLog("⚙️ [풀바디 엔진] 강화된 하체와 코어 라인이 연동된 상태로 피스톤 스트로크 구동 중!");
        }

        updateUI();
        triggerFullBodyAnimation();
    }

    function triggerFullBodyAnimation() {
        let step = 0;
        let maxSteps = 6;
        let interval = setInterval(() => {
            step++;
            let offset = Math.sin(step * 1.2) * 14;
            drawScene(offset);

            if (step >= maxSteps) {
                clearInterval(interval);
                isDriving = false;
                drawScene(0);
            }
        }, 40);
    }

    function actionRest() {
        if (isDriving || stamina >= 100) return;

        isRefractory = true;
        isDriving = false;
        addLog("💤 [불응기] 강제 쿨다운 진입... 체력 재충전 및 밀착 휴식 중.");

        let restInterval = setInterval(() => {
            stamina += 30;
            if (stamina > 100) stamina = 100;
            updateUI();

            if (stamina >= 100) {
                clearInterval(restInterval);
                isRefractory = false;
                addLog("✅ [시스템 리프레시] 불응기 해제. 다시 구동 가능합니다.");
                updateUI();
            }
        }, 1000);
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            actionDrive();
        }
    });

    drawScene(0);
    updateUI();
</script>

</body>
</html>
