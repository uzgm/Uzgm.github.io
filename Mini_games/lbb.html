<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Legacy Low Bar</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #111;
    color: white;

    font-family: Arial, sans-serif;

    touch-action: manipulation;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    width: 100%;
    height: 100%;
    max-width: 900px;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

#mainScreen,
#result {
    width: 100%;
    text-align: center;
}

h1 {
    margin: 0 0 8px;

    font-size: clamp(32px, 8vw, 64px);
}

#subtitle {
    margin-bottom: 25px;

    color: #aaa;

    font-size: clamp(15px, 3vw, 20px);
}

#score {
    font-size: clamp(45px, 12vw, 90px);
    font-weight: bold;

    margin-bottom: 5px;
}

#timer {
    font-size: clamp(20px, 5vw, 32px);

    margin-bottom: 30px;
}

#tapButton {
    width: min(70vw, 420px);
    height: min(70vw, 420px);

    border: none;
    border-radius: 50%;

    background: #f2c94c;
    color: #111;

    font-size: clamp(30px, 8vw, 60px);
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 12px 0 #9c7c16,
        0 20px 35px rgba(0, 0, 0, 0.5);

    user-select: none;
    -webkit-user-select: none;

    transition:
        transform 0.04s,
        box-shadow 0.04s;
}

#tapButton:active {
    transform: translateY(10px) scale(0.96);

    box-shadow:
        0 3px 0 #9c7c16,
        0 8px 20px rgba(0, 0, 0, 0.4);
}

#tapButton:disabled {
    opacity: 0.5;
}

#startButton,
#restartButton {
    margin-top: 25px;

    padding: 15px 35px;

    border: none;
    border-radius: 12px;

    background: white;
    color: #111;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
}

#restartButton {
    display: none;
}

#result {
    display: none;
}

#resultTitle {
    font-size: clamp(28px, 7vw, 50px);

    margin-bottom: 15px;
}

#finalScore {
    font-size: clamp(55px, 14vw, 100px);

    font-weight: bold;

    margin-bottom: 20px;
}

#grade {
    font-size: clamp(22px, 5vw, 38px);

    font-weight: bold;

    line-height: 1.4;

    min-height: 55px;
}

#retryText {
    margin-top: 12px;

    color: #999;

    font-size: 15px;
}

</style>

</head>


<body>

<div id="game">

    <div id="mainScreen">

        <h1>Legacy Low Bar</h1>

        <div id="subtitle">
            Ovenbound의 마지막 발악 연습
        </div>

        <div id="score">
            0
        </div>

        <div id="timer">
            준비하세요
        </div>

        <button id="tapButton" disabled>
            발악!!
        </button>

        <button id="startButton">
            발악 시작
        </button>

    </div>


    <div id="result">

        <div id="resultTitle">
            마지막 발악 종료
        </div>

        <div id="finalScore">
            0
        </div>

        <div id="grade">
            판정
        </div>

        <div id="retryText">
            다시 한번 발악해보시겠습니까?
        </div>

        <button id="restartButton">
            다시하기
        </button>

    </div>

</div>


<script>

const scoreElement =
    document.getElementById("score");

const timerElement =
    document.getElementById("timer");

const tapButton =
    document.getElementById("tapButton");

const startButton =
    document.getElementById("startButton");

const mainScreen =
    document.getElementById("mainScreen");

const resultScreen =
    document.getElementById("result");

const finalScoreElement =
    document.getElementById("finalScore");

const gradeElement =
    document.getElementById("grade");

const restartButton =
    document.getElementById("restartButton");


let score = 0;
let timeLeft = 10;

let gameRunning = false;
let timer = null;


/*
    발악 등급
*/
function getGrade(score) {

    if (score < 60) {

        return "발악의 악도 모르시는군요?";

    }

    if (score < 90) {

        return "꽤 못하네요";

    }

    if (score < 110) {

        return "보통은 생긴 것과는 다르게 꽤 치네요";

    }

    if (score < 130) {

        return "발악을 더하세요!! 암암!!!!!!!!";

    }

    return "우.와.정.말.잘.했.어.요.";

}


/*
    게임 시작
*/
function startGame() {

    score = 0;
    timeLeft = 10;

    gameRunning = true;

    scoreElement.textContent = "0";
    timerElement.textContent = "10.0초";

    tapButton.disabled = false;

    startButton.style.display = "none";

    clearInterval(timer);

    timer = setInterval(() => {

        timeLeft -= 0.1;

        if (timeLeft <= 0) {

            timeLeft = 0;

            endGame();

            return;
        }

        timerElement.textContent =
            timeLeft.toFixed(1) + "초";

    }, 100);

}


/*
    연타
*/
function tap() {

    if (!gameRunning) {
        return;
    }

    score++;

    scoreElement.textContent = score;

}


/*
    게임 종료
*/
function endGame() {

    gameRunning = false;

    clearInterval(timer);

    timer = null;

    tapButton.disabled = true;

    finalScoreElement.textContent = score;

    gradeElement.textContent =
        getGrade(score);

    mainScreen.style.display = "none";

    resultScreen.style.display = "block";

    restartButton.style.display = "inline-block";

}


/*
    다시하기
*/
function restartGame() {

    resultScreen.style.display = "none";

    mainScreen.style.display = "block";

    startButton.style.display = "inline-block";

    scoreElement.textContent = "0";

    timerElement.textContent = "준비하세요";

}


/*
    PC 스페이스바
*/
document.addEventListener("keydown", (event) => {

    if (event.code === "Space") {

        event.preventDefault();

        tap();

    }

});


/*
    모바일 + PC 마우스
*/
tapButton.addEventListener("pointerdown", (event) => {

    event.preventDefault();

    tap();

});


/*
    시작
*/
startButton.addEventListener("click", () => {

    startGame();

});


/*
    재시작
*/
restartButton.addEventListener("click", () => {

    restartGame();

});

</script>

</body>

   </html>
