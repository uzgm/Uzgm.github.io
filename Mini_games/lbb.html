<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Legacy Low Bar</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        touch-action: manipulation;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #game {
        width: 100%;
        height: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    h1 {
        margin: 0 0 10px;
        font-size: clamp(32px, 8vw, 64px);
        text-align: center;
    }

    #subtitle {
        color: #aaa;
        margin-bottom: 25px;
        font-size: clamp(14px, 3vw, 20px);
    }

    #score {
        font-size: clamp(40px, 12vw, 90px);
        font-weight: bold;
        margin-bottom: 10px;
    }

    #timer {
        font-size: clamp(20px, 5vw, 32px);
        margin-bottom: 30px;
    }

    #tapButton {
        width: min(70vw, 420px);
        height: min(70vw, 420px);
        max-height: 420px;

        border: none;
        border-radius: 50%;

        background: #f2c94c;
        color: #111;

        font-size: clamp(30px, 8vw, 60px);
        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 12px 0 #9c7c16,
            0 20px 35px rgba(0, 0, 0, 0.5);

        user-select: none;
        -webkit-user-select: none;

        transition:
            transform 0.05s,
            box-shadow 0.05s;
    }

    #tapButton:active {
        transform: translateY(10px) scale(0.96);
        box-shadow:
            0 3px 0 #9c7c16,
            0 8px 20px rgba(0, 0, 0, 0.4);
    }

    #tapButton:disabled {
        opacity: 0.5;
        cursor: default;
    }

    #startButton,
    #restartButton {
        margin-top: 25px;
        padding: 15px 35px;

        border: none;
        border-radius: 12px;

        background: white;
        color: #111;

        font-size: 20px;
        font-weight: bold;

        cursor: pointer;
    }

    #restartButton {
        display: none;
    }

    #result {
        display: none;
        text-align: center;
    }

    #resultTitle {
        font-size: clamp(28px, 7vw, 50px);
        margin-bottom: 10px;
    }

    #finalScore {
        font-size: clamp(45px, 12vw, 90px);
        font-weight: bold;
    }

    #message {
        margin-top: 10px;
        color: #aaa;
    }

    .hidden {
        display: none !important;
    }
</style>
</head>

<body>

<div id="game">

    <div id="mainScreen">

        <h1>Legacy Low Bar</h1>

        <div id="subtitle">
            최대한 빠르게 연타하세요.
        </div>

        <div id="score">0</div>

        <div id="timer">
            준비하세요
        </div>

        <button id="tapButton" disabled>
            연타!
        </button>

        <button id="startButton">
            게임 시작
        </button>

    </div>


    <div id="result">

        <div id="resultTitle">
            GAME OVER
        </div>

        <div id="finalScore">
            0
        </div>

        <div id="message">
            회 연타
        </div>

        <button id="restartButton">
            다시하기
        </button>

    </div>

</div>


<script>
const scoreElement = document.getElementById("score");
const timerElement = document.getElementById("timer");

const tapButton = document.getElementById("tapButton");
const startButton = document.getElementById("startButton");

const mainScreen = document.getElementById("mainScreen");
const resultScreen = document.getElementById("result");

const finalScoreElement = document.getElementById("finalScore");
const restartButton = document.getElementById("restartButton");

let score = 0;
let timeLeft = 10;

let gameRunning = false;
let timer = null;


function startGame() {

    score = 0;
    timeLeft = 10;
    gameRunning = true;

    scoreElement.textContent = "0";
    timerElement.textContent = "10.0초";

    tapButton.disabled = false;

    startButton.style.display = "none";

    clearInterval(timer);

    timer = setInterval(() => {

        timeLeft -= 0.1;

        if (timeLeft <= 0) {

            timeLeft = 0;

            endGame();

            return;
        }

        timerElement.textContent =
            timeLeft.toFixed(1) + "초";

    }, 100);

}


function tap() {

    if (!gameRunning) {
        return;
    }

    score++;

    scoreElement.textContent = score;
}


function endGame() {

    gameRunning = false;

    clearInterval(timer);
    timer = null;

    tapButton.disabled = true;

    finalScoreElement.textContent = score;

    mainScreen.style.display = "none";
    resultScreen.style.display = "block";

    restartButton.style.display = "inline-block";
}


function restartGame() {

    resultScreen.style.display = "none";
    mainScreen.style.display = "block";

    startButton.style.display = "inline-block";

    timerElement.textContent = "준비하세요";

    scoreElement.textContent = "0";
}


/*
    PC
    스페이스바로 연타
*/
document.addEventListener("keydown", (event) => {

    if (event.code === "Space") {

        event.preventDefault();

        if (!gameRunning) {
            return;
        }

        tap();
    }

});


/*
    PC + 모바일
    마우스 클릭 / 터치
*/
tapButton.addEventListener("pointerdown", (event) => {

    event.preventDefault();

    tap();

});


startButton.addEventListener("click", () => {

    startGame();

});


restartButton.addEventListener("click", () => {

    restartGame();

});


/*
    화면 크기 변경 대응
*/
window.addEventListener("resize", () => {

    document.body.style.width = "100%";
    document.body.style.height = "100%";

});


</script>

</body>
</html>
